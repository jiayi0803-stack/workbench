<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f6f5ef" />
<title>个人工作台</title>
<style>
  :root {
    --bg: #f6f5ef;
    --paper: #ffffff;
    --ink: #1f2024;
    --ink-soft: #5a5d66;
    --line: #e7e5dc;
    --line-soft: #efede5;
    --accent: #4f6b3a;
    --accent-soft: #eaf0dc;
    --warn: #b14b3a;
    --shadow: 0 6px 24px rgba(40, 50, 30, 0.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }

  /* ====== 顶部栏 ====== */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(246, 245, 239, 0.92);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px;
    display: grid; place-items: center;
    color: var(--ink);
    transition: background .15s;
  }
  .icon-btn:hover { background: var(--line-soft); }
  .icon-btn svg { width: 22px; height: 22px; }
  .topbar .title {
    font-size: 17px; font-weight: 600; letter-spacing: .2px;
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .topbar .date {
    color: var(--ink-soft); font-size: 12px;
    padding: 4px 8px; border-radius: 8px; background: var(--line-soft);
  }

  /* ====== 主内容 ====== */
  main {
    padding: 18px 16px 120px;
    max-width: 720px; margin: 0 auto;
  }
  .hero {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .hero .editable {
    border: 1px dashed transparent;
    border-radius: 8px;
    padding: 2px 4px;
    margin: -2px -4px;
    transition: border-color .15s, background .15s;
    cursor: text;
  }
  .hero .editable:hover { border-color: var(--line); background: var(--bg); }
  .hero .editable:focus {
    outline: none;
    border-color: var(--accent); background: #fff;
  }
  .hero h1 {
    margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: .5px;
  }
  .hero p { margin: 0; color: var(--ink-soft); font-size: 13px; }
  .progress {
    margin-top: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .bar {
    flex: 1; height: 8px; background: var(--line-soft); border-radius: 999px; overflow: hidden;
  }
  .bar > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, #6d8a4f, #4f6b3a);
    width: 0%; transition: width .4s ease;
  }
  .progress .pct { color: var(--ink-soft); font-size: 12px; min-width: 64px; text-align: right; }

  /* 二级导航 */
  .subnav {
    display: flex; gap: 8px;
    overflow-x: auto; padding-bottom: 4px;
    margin-bottom: 16px;
    scrollbar-width: none;
  }
  .subnav::-webkit-scrollbar { display: none; }
  .subnav button {
    flex: 0 0 auto;
    padding: 7px 14px; border-radius: 999px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink-soft); font-size: 13px;
  }
  .subnav button.active {
    background: var(--accent); color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }
  .subnav .add-sub {
    width: 34px; height: 34px; padding: 0; border-radius: 999px;
    display: grid; place-items: center; font-size: 18px;
  }

  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    margin: 6px 4px 10px;
  }
  .section-title h2 {
    margin: 0; font-size: 14px; font-weight: 600; color: var(--ink-soft);
    letter-spacing: 1px;
  }
  .section-title .count { color: var(--ink-soft); font-size: 12px; }

  /* 待办卡片 */
  ul.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  li.item {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 12px;
    display: flex; align-items: flex-start; gap: 10px;
    box-shadow: var(--shadow);
    transition: transform .15s, border-color .15s, background .15s;
    touch-action: pan-y;
  }
  li.item.dragging { opacity: .5; border-color: var(--accent); background: var(--accent-soft); }
  li.item:active { transform: scale(.995); }
  li.item.done { opacity: .55; }
  li.item.done .text { text-decoration: line-through; color: var(--ink-soft); }

  .drag-handle {
    flex: 0 0 auto; width: 22px; height: 22px;
    display: grid; place-items: center; color: #c4c8be;
    margin-top: 1px; cursor: grab;
  }
  .drag-handle svg { width: 14px; height: 14px; }
  .drag-handle:active { cursor: grabbing; }

  .check {
    flex: 0 0 auto;
    width: 22px; height: 22px; border-radius: 7px;
    border: 1.5px solid #c4c8be; background: #fff;
    display: grid; place-items: center;
    transition: all .15s;
    margin-top: 1px;
  }
  .check:hover { border-color: var(--accent); }
  .check svg { width: 14px; height: 14px; color: #fff; opacity: 0; }
  li.item.done .check { background: var(--accent); border-color: var(--accent); }
  li.item.done .check svg { opacity: 1; }

  .text {
    flex: 1; min-width: 0;
    word-break: break-word; white-space: pre-wrap;
  }
  .meta { color: var(--ink-soft); font-size: 11px; margin-top: 4px; }

  .row-actions { display: flex; gap: 4px; }
  .row-actions button {
    color: var(--ink-soft); font-size: 12px;
    padding: 4px 8px; border-radius: 6px;
  }
  .row-actions button:hover { background: var(--line-soft); color: var(--ink); }
  .row-actions .del:hover { color: var(--warn); }

  /* 添加按钮 */
  .add-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(246,245,239,0) 0%, rgba(246,245,239,.95) 30%);
    display: flex; gap: 10px; justify-content: center;
    z-index: 20; pointer-events: none;
  }
  .add-bar > * { pointer-events: auto; }
  .add-btn {
    background: var(--accent); color: #fff;
    border-radius: 999px; padding: 12px 22px;
    font-weight: 600; font-size: 14px;
    box-shadow: 0 6px 18px rgba(79, 107, 58, .35);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .add-btn svg { width: 16px; height: 16px; }
  .ghost-btn {
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px; padding: 12px 16px;
    font-size: 14px; box-shadow: var(--shadow);
  }

  /* 抽屉（侧边导航） */
  .scrim {
    position: fixed; inset: 0; background: rgba(20, 24, 16, .4);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 40;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 82%; max-width: 320px;
    background: var(--paper);
    box-shadow: 4px 0 30px rgba(0,0,0,.18);
    transform: translateX(-100%);
    transition: transform .28s cubic-bezier(.2,.7,.2,1);
    z-index: 50;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  .drawer header {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .drawer .name {
    font-size: 20px; font-weight: 700; color: var(--accent);
    letter-spacing: 1px;
    border: 1px dashed transparent; border-radius: 8px;
    padding: 2px 4px; margin: -2px -4px;
    cursor: text;
  }
  .drawer .name:hover { border-color: var(--line); background: var(--bg); }
  .drawer .name:focus { outline: none; border-color: var(--accent); background: #fff; color: var(--ink); }
  .drawer .sub {
    color: var(--ink-soft); font-size: 12px; margin-top: 6px;
    border: 1px dashed transparent; border-radius: 8px;
    padding: 2px 4px; margin-left: -4px; margin-right: -4px;
    cursor: text;
  }
  .drawer .sub:hover { border-color: var(--line); background: var(--bg); }
  .drawer .sub:focus { outline: none; border-color: var(--accent); background: #fff; color: var(--ink); }

  nav.menu { flex: 1; overflow-y: auto; padding: 10px 8px 16px; }
  nav.menu button.item-btn {
    width: 100%; text-align: left;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; margin: 2px 0;
    border-radius: 10px;
    color: var(--ink); font-size: 15px;
    transition: background .15s;
    position: relative;
  }
  nav.menu button.item-btn:hover { background: var(--line-soft); }
  nav.menu button.item-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  nav.menu .emoji { width: 22px; text-align: center; }
  nav.menu .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav.menu .badge {
    background: var(--line-soft); color: var(--ink-soft);
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
  }
  nav.menu button.item-btn.active .badge { background: var(--accent); color: #fff; }

  .drawer footer {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line-soft);
    display: flex; gap: 8px; justify-content: space-between; align-items: center;
  }
  .drawer footer .small { color: var(--ink-soft); font-size: 11px; }
  .manage-btn {
    color: var(--accent); font-size: 13px; font-weight: 600;
    padding: 6px 10px; border-radius: 8px;
  }
  .manage-btn:hover { background: var(--accent-soft); }

  /* 模态框 */
  .modal {
    position: fixed; inset: 0; z-index: 60;
    display: none; align-items: flex-end; justify-content: center;
    background: rgba(20, 24, 16, .45);
  }
  .modal.open { display: flex; animation: fadeIn .2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    background: var(--paper);
    width: 100%; max-width: 520px;
    border-radius: 18px 18px 0 0;
    padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 86vh; overflow-y: auto;
    animation: slideUp .25s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .field label { color: var(--ink-soft); font-size: 12px; }
  .field input[type=text], .field textarea, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 15px;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .field input[type=text]:focus, .field textarea:focus, .field select:focus {
    border-color: var(--accent); background: #fff;
  }
  .field textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
  .emoji-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-row button {
    width: 36px; height: 36px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg);
    font-size: 18px; line-height: 1;
  }
  .emoji-row button.active { border-color: var(--accent); background: var(--accent-soft); }
  .sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  .btn-primary {
    background: var(--accent); color: #fff;
    padding: 10px 18px; border-radius: 10px; font-weight: 600;
  }
  .btn-ghost {
    background: var(--bg); color: var(--ink);
    padding: 10px 16px; border-radius: 10px;
  }
  .btn-danger {
    background: transparent; color: var(--warn);
    padding: 10px 16px; border-radius: 10px;
  }

  /* 管理分类（拖拽） */
  .manage-list { display: grid; gap: 8px; margin-bottom: 14px; }
  .manage-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px;
    cursor: grab; user-select: none;
  }
  .manage-row.dragging { opacity: .5; border-color: var(--accent); }
  .manage-row .emoji { font-size: 18px; }
  .manage-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .manage-row button { color: var(--ink-soft); font-size: 12px; padding: 4px 8px; border-radius: 6px; }
  .manage-row button:hover { background: var(--line-soft); color: var(--ink); }
  .manage-row .del:hover { color: var(--warn); }

  .empty {
    text-align: center; color: var(--ink-soft);
    padding: 40px 20px; font-size: 14px;
  }
  .empty .big { font-size: 30px; margin-bottom: 6px; }

  /* 财经新闻快讯 */
  .news-wrap {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .news-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .news-head h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: .5px; }
  .news-refresh {
    color: var(--accent); font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 8px; background: var(--accent-soft);
  }
  .news-refresh:active { transform: scale(.96); }
  .news-list { display: grid; gap: 8px; max-height: 320px; overflow-y: auto; }
  .news-item {
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 10px;
    border-left: 3px solid var(--accent);
    cursor: pointer;
    transition: background .15s;
  }
  .news-item:active { background: var(--accent-soft); }
  .news-item .nt { font-size: 13px; line-height: 1.5; color: var(--ink); word-break: break-word; }
  .news-item .nm { display: flex; gap: 8px; margin-top: 4px; }
  .news-item .src { color: var(--accent); font-size: 11px; font-weight: 600; }
  .news-item .time { color: var(--ink-soft); font-size: 11px; }
  .news-loading, .news-error { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 20px; }
  .news-error { color: var(--warn); }
  .news-foot { margin-top: 8px; text-align: right; color: var(--ink-soft); font-size: 11px; }

  .toast {
    position: fixed; left: 50%; bottom: 90px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(31,32,36,.92); color: #fff;
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 80;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 720px) {
    .sheet { border-radius: 18px; max-width: 460px; margin-bottom: 4vh; }
    .modal { align-items: center; }
  }

  /* ====== 日历视图 ====== */
  .cal-wrap { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 18px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head .ym { font-size: 17px; font-weight: 700; }
  .cal-head button { color: var(--accent); font-size: 18px; width: 32px; height: 32px; border-radius: 8px; }
  .cal-head button:hover { background: var(--accent-soft); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grid .dow { text-align: center; color: var(--ink-soft); font-size: 11px; padding: 4px 0; }
  .cal-cell {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; font-size: 13px; cursor: pointer; position: relative;
    border: 1px solid transparent;
  }
  .cal-cell:hover { background: var(--line-soft); }
  .cal-cell.other { opacity: .3; }
  .cal-cell.today { border-color: var(--accent); font-weight: 700; }
  .cal-cell.selected { background: var(--accent-soft); border-color: var(--accent); }
  .cal-cell .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 2px; }
  .cal-cell .dot.done { background: #4f9b3a; }
  .cal-cell .dot.partial { background: #e0a030; }
  .cal-cell .dot.none { background: #ccc; }
  .cal-day-detail {
    margin-top: 14px; padding: 14px; background: var(--bg); border-radius: 10px;
    display: none;
  }
  .cal-day-detail.show { display: block; }
  .cal-day-detail h3 { margin: 0 0 8px; font-size: 15px; }

  /* ====== 健康记录 ====== */
  .health-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .health-tabs button {
    flex: 1; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: var(--paper); border: 1px solid var(--line); color: var(--ink-soft);
  }
  .health-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .health-form { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .health-form .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .health-form .field { flex: 1; min-width: 120px; }
  .health-form .rating { display: flex; gap: 4px; }
  .health-form .rating button { font-size: 20px; opacity: .4; }
  .health-form .rating button.active { opacity: 1; }
  .chart-wrap { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .chart-wrap h3 { margin: 0 0 10px; font-size: 14px; color: var(--ink-soft); }
  .health-list { display: grid; gap: 8px; }
  .health-row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
  .health-row .date { flex: 0 0 auto; color: var(--ink-soft); font-size: 12px; width: 80px; }
  .health-row .vals { flex: 1; font-size: 13px; }
  .health-row .del { color: var(--warn); font-size: 12px; }
</style>

<body>

<!-- 顶部栏 -->
<header class="topbar">
  <button class="icon-btn" id="btn-menu" aria-label="打开导航">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>
  <div class="title" id="top-title">日程（工作）</div>
  <div class="date" id="top-date"></div>
</header>

<main>
  <section class="hero">
    <p class="editable" id="hero-sub" contenteditable="true" spellcheck="false">完成一项打勾，进度一目了然。</p>
    <div class="progress">
      <div class="bar"><i id="bar-fill"></i></div>
      <div class="pct" id="pct-text">0 / 0</div>
    </div>
  </section>

  <!-- 二级导航 -->
  <div class="subnav" id="subnav"></div>

  <!-- 财经新闻快讯（仅理财分类显示） -->
  <section class="news-wrap" id="news-wrap" style="display:none">
    <div class="news-head">
      <h2>📊 财经快讯</h2>
      <button class="news-refresh" id="news-refresh">刷新</button>
    </div>
    <div class="news-list" id="news-list">
      <div class="news-loading">加载中...</div>
    </div>
    <div class="news-foot" id="news-foot"></div>
  </section>

  <!-- 特殊视图容器（日历/健康记录等） -->
  <div id="special-view"></div>

  <div class="section-title">
    <h2>今日条目</h2>

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // 兼容 v1 数据
      const old = localStorage.getItem('workbench_v1');
      if (old) {
        const v1 = JSON.parse(old);
        const cats = (v1.cats || DEFAULT_CATS).map(c => ({ ...c, subs: c.subs || [] }));
        const items = {};
        for (const k in (v1.items || {})) items[k] = (v1.items[k] || []).map(it => ({ ...it, subId: undefined, order: it.order || 0 }));
        return {
          cats, items,
          currentCatId: v1.currentCatId || cats[0].id,
          currentSubId: '', userName: '我的工作台',
          userSub: '点选分类切换 · 长按可管理', heroSubs: {}
        };
      }
      return defaultState();
    }
    const obj = JSON.parse(raw);
    const merged = [...(obj.cats || [])];
    DEFAULT_CATS.forEach(d => { if (!merged.find(c => c.id === d.id)) merged.push({ ...d, subs: [] }); });
    merged.forEach(c => { if (!c.subs) c.subs = []; });
    if (!obj.items) obj.items = {};
    return {
      cats: merged,
      items: obj.items,
      currentCatId: obj.currentCatId || merged[0].id,
      currentSubId: obj.currentSubId || '',
      userName: obj.userName || '我的工作台',
      userSub: obj.userSub || '点选分类切换 · 长按可管理',
      heroSubs: obj.heroSubs || {},
      health: obj.health || { sleep: [], body: [] },

    userName: '我的工作台',
    userSub: '点选分类切换 · 长按可管理',

function genId() { return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ========== Gitee 云端同步（自动双向同步） ========== */
// 用 Gitee API 读写 data.json，实现自动同步
// Token 存 localStorage，不硬编码在代码里
const GITEE_TOKEN_KEY = 'gitee_sync_token';
const GITEE_OWNER = 'hu-jiayi0803';
const GITEE_REPO = 'workbench';
const GITEE_DATA_FILE = 'data.json';
const GITEE_BRANCH = 'master';
function getSyncToken() {
  return localStorage.getItem(GITEE_TOKEN_KEY) || '';
}
function setSyncToken(t) {
  localStorage.setItem(GITEE_TOKEN_KEY, t);
}
function ensureSyncToken() {
  if (!getSyncToken()) {
    const t = prompt('请输入 Gitee 私人令牌（用于自动同步，仅保存在本地浏览器）：\n\n在 Gitee → 设置 → 私人令牌 生成，权限勾选 projects。');
    if (t && t.trim()) { setSyncToken(t.trim()); return true; }
    return false;
  }
  return true;
}

// 防抖推送
let pushTimer = null;
let isPushing = false;
function cloudPush() {
  if (!getSyncToken()) return; // 没 token 不同步
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    await doCloudPush();
  }, 1500);
}

async function doCloudPush() {
  if (isPushing) return;
  isPushing = true;
  try {
    const token = getSyncToken();
    const data = {
      cats: state.cats, items: state.items, health: state.health, assets: state.assets,
      currentCatId, currentSubId,
      userName: state.userName, userSub: state.userSub, heroSubs: state.heroSubs,
      updatedAt: Date.now()
    };
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    // 先获取现有文件的 sha（Gitee 更新需要）
    let sha = null;
    try {
      const r = await fetch(`https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/${GITEE_DATA_FILE}?ref=${GITEE_BRANCH}&access_token=${token}`);
      if (r.ok) { const j = await r.json(); sha = j.sha; }
    } catch (e) {}
    // PUT 更新文件
    const body = new FormData();
    body.append('access_token', token);
    body.append('content', content);
    body.append('message', 'sync ' + new Date().toLocaleString('zh-CN'));
    body.append('branch', GITEE_BRANCH);
    if (sha) body.append('sha', sha);
    const r2 = await fetch(`https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/${GITEE_DATA_FILE}`, {
      method: 'PUT', body: body
    });
    if (r2.ok) {
      // 推送成功，更新本地 updatedAt
      const localRaw = localStorage.getItem(STORAGE_KEY);
      const localObj = localRaw ? JSON.parse(localRaw) : {};
      localObj.updatedAt = data.updatedAt;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(localObj));
    }
  } catch (e) { console.warn('cloudPush failed:', e); }
  isPushing = false;
}

// 从 Gitee 拉取数据
async function cloudPull(force) {
  if (!getSyncToken()) {
    if (force && !ensureSyncToken()) return false;
    else if (!force) return false;
  }
  try {
    const token = getSyncToken();
    const r = await fetch(`https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/${GITEE_DATA_FILE}?ref=${GITEE_BRANCH}&access_token=${token}&t=${Date.now()}`);
    if (!r.ok) return false;
    const j = await r.json();
    const data = JSON.parse(decodeURIComponent(escape(atob(j.content))));
    const localRaw = localStorage.getItem(STORAGE_KEY);
    const localObj = localRaw ? JSON.parse(localRaw) : {};
    const localUpdated = localObj.updatedAt || 0;
    const cloudNewer = (data.updatedAt || 0) > localUpdated;
    const localEmpty = !localRaw || !localObj.items || Object.keys(localObj.items).length === 0
      || Object.values(localObj.items).every(arr => !arr || arr.length === 0);
    if (cloudNewer || localEmpty || force) {
      // 保护：云端 cats 为空时不覆盖（避免渲染崩溃）
      if (data.cats && data.cats.length > 0) state.cats = data.cats;
      state.items = data.items || state.items;
      if (data.currentCatId) currentCatId = data.currentCatId;
      if (data.currentSubId !== undefined) currentSubId = data.currentSubId;
      if (data.userName) state.userName = data.userName;
      if (data.userSub) state.userSub = data.userSub;
      if (data.heroSubs) state.heroSubs = data.heroSubs;
      if (data.health) state.health = data.health;
      if (data.assets) state.assets = data.assets;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        cats: state.cats, items: state.items, health: state.health, assets: state.assets, currentCatId, currentSubId,
        userName: state.userName, userSub: state.userSub, heroSubs: state.heroSubs,
        updatedAt: data.updatedAt
      }));
      return true;
    }
    return false;
  } catch (e) { console.warn('cloudPull failed:', e); return false; }
}

function currentCat() { return state.cats.find(c => c.id === currentCatId) || state.cats[0]; }
function activeItems() {
  const arr = state.items[currentCatId] || [];
  if (!currentSubId) return arr;
  return arr.filter(i => i.subId === currentSubId || (!i.subId && currentSubId === '__none__'));

  const cat = currentCat();
  const nav = document.getElementById('subnav');
  nav.innerHTML = '';
  const all = document.createElement('button');
  all.textContent = '全部';
  all.className = currentSubId === '' ? 'active' : '';
  all.addEventListener('click', () => { currentSubId = ''; save(); renderAll(); });
  nav.appendChild(all);
  (cat.subs || []).forEach(s => {
    const b = document.createElement('button');
    b.textContent = s.name;
    b.className = currentSubId === s.id ? 'active' : '';
    b.addEventListener('click', () => { currentSubId = s.id; save(); renderAll(); });
    nav.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'add-sub'; add.textContent = '＋';
  add.addEventListener('click', () => addSubGroup());
  nav.appendChild(add);
}
function addSubGroup() {
  const name = prompt('新子分组名称：');
  if (!name || !name.trim()) return;
  const cat = currentCat();
  if (!cat.subs) cat.subs = [];
  cat.subs.push({ id: genId(), name: name.trim() });
  save(); renderAll();
}

/* ========== 渲染：主区域 ========== */
/* ========== 日历视图（汇总早午晚完成情况） ========== */
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let calSelectedDate = formatDate(new Date());

// 早午晚分类 ID
const CAL_CATS = ['morning', 'noon', 'evening'];
const CAL_NAMES = { morning: '早', noon: '午', evening: '晚' };

function getDaySummary(dateStr) {
  // 返回早午晚三个分类在某天的完成情况
  // 兼容老数据：没有 date 字段时用 created 时间戳推算当天日期
  const summary = {};
  CAL_CATS.forEach(cid => {
    const items = (state.items[cid] || []).filter(i => {
      const d = i.date || (i.created ? formatDate(new Date(i.created)) : null);
      return d === dateStr;
    });
    summary[cid] = {
      total: items.length,
      done: items.filter(i => i.done).length,
      items: items
    };
  });
  return summary;
}

function renderCalendarView(cat, container) {
  const today = new Date();
  const todayStr = formatDate(today);
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
  const startDow = firstDay.getDay();
  const prevLast = new Date(calYear, calMonth, 0).getDate();

  let html = '<div class="cal-wrap">';
  html += '<div class="cal-head">';
  html += '<button id="cal-prev">‹</button>';
  html += `<span class="ym">${calYear}年${calMonth + 1}月</span>`;
  html += '<button id="cal-next">›</button>';
  html += '</div>';
  html += '<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(d => html += `<span class="dow">${d}</span>`);
  for (let i = startDow - 1; i >= 0; i--) {
    html += `<div class="cal-cell other"><span>${prevLast - i}</span></div>`;
  }
  for (let d = 1; d <= lastDate; d++) {
    const dt = new Date(calYear, calMonth, d);
    const ds = formatDate(dt);
    const summary = getDaySummary(ds);
    const totalAll = CAL_CATS.reduce((s, c) => s + summary[c].total, 0);
    const doneAll = CAL_CATS.reduce((s, c) => s + summary[c].done, 0);
    let dotClass = '';
    if (totalAll > 0) dotClass = doneAll === totalAll ? 'done' : (doneAll > 0 ? 'partial' : 'none');
    const isToday = ds === todayStr;
    const isSelected = ds === calSelectedDate;
    html += `<div class="cal-cell${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}" data-date="${ds}">
      <span>${d}</span>
      ${totalAll > 0 ? `<div class="dot ${dotClass}"></div>` : ''}
    </div>`;
  }
  const totalCells = startDow + lastDate;
  const remain = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remain; i++) {
    html += `<div class="cal-cell other"><span>${i}</span></div>`;
  }
  html += '</div>';
  // 图例
  html += '<div style="display:flex;gap:12px;margin-top:10px;font-size:11px;color:var(--ink-soft)">';
  html += '<span><span class="dot done" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#4f9b3a;vertical-align:middle"></span> 全部完成</span>';
  html += '<span><span class="dot partial" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0a030;vertical-align:middle"></span> 部分完成</span>';
  html += '<span><span class="dot none" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;vertical-align:middle"></span> 未完成</span>';
  html += '</div>';
  html += '</div>';

  // 选中日期的详情（只读模式，只展示不修改）
  const selSummary = getDaySummary(calSelectedDate);
  const [y,m,dd] = calSelectedDate.split('-');
  const totalAll = CAL_CATS.reduce((s, c) => s + selSummary[c].total, 0);
  const doneAll = CAL_CATS.reduce((s, c) => s + selSummary[c].done, 0);
  html += `<div class="cal-day-detail show" id="cal-detail">`;
  html += `<h3>${y}年${+m}月${+dd}日 ${totalAll ? `· 总计 ${doneAll}/${totalAll} 完成` : '· 无安排'}</h3>`;
  CAL_CATS.forEach(cid => {
    const s = selSummary[cid];
    const cat = state.cats.find(c => c.id === cid);
    const emoji = cat ? cat.emoji : '';
    const name = cat ? cat.name : cid;
    html += `<div style="margin-bottom:12px">`;
    html += `<div style="font-weight:600;font-size:14px;margin-bottom:4px">${emoji} ${name} ${s.total ? `（${s.done}/${s.total}）` : '（无安排）'}</div>`;
    if (s.items.length) {
      s.items.forEach(it => {
        html += `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px">`;
        html += `<span>${it.done ? '✅' : '⬜'}</span>`;
        html += `<span style="flex:1;${it.done ? 'text-decoration:line-through;color:var(--ink-soft)' : ''}">${escapeHtml(it.text)}</span>`;
        html += `</div>`;
      });
    }
    html += `</div>`;
  });
  if (totalAll === 0) {
    html += `<p style="color:var(--ink-soft);font-size:13px;margin-top:8px">这天没有安排。去「日程（早/午/晚）」里添加条目即可在此查看。</p>`;
  }
  html += '</div>';

  container.innerHTML = html;

  // 绑定事件（只有翻月和选日期，没有增删改）
  const prev = document.getElementById('cal-prev');
  const next = document.getElementById('cal-next');
  if (prev) prev.addEventListener('click', () => { calMonth--; if (calMonth<0){calMonth=11;calYear--;} renderAll(); });
  if (next) next.addEventListener('click', () => { calMonth++; if (calMonth>11){calMonth=0;calYear++;} renderAll(); });
  container.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
    cell.addEventListener('click', () => { calSelectedDate = cell.dataset.date; renderAll(); });
  });
}

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ========== 健康记录视图 ========== */
let healthTab = 'sleep';

function getHealthData() {
  if (!state.health) state.health = { sleep: [], body: [] };
  return state.health;
}

function renderHealthView(cat, container) {
  const data = getHealthData();
  let html = '<div class="health-tabs">';
  html += `<button class="${healthTab==='sleep'?'active':''}" id="tab-sleep">😴 睡眠记录</button>`;
  html += `<button class="${healthTab==='body'?'active':''}" id="tab-body">⚖️ 体重/腰围</button>`;
  html += '</div>';
  html += '<div id="health-content"></div>';
  container.innerHTML = html;
  document.getElementById('tab-sleep').addEventListener('click', () => { healthTab='sleep'; renderAll(); });
  document.getElementById('tab-body').addEventListener('click', () => { healthTab='body'; renderAll(); });

function renderHealthContent() {
  const el = document.getElementById('health-content');
  if (!el) return;
  const data = getHealthData();
  if (healthTab === 'sleep') {
    el.innerHTML = renderSleepForm() + renderSleepChart(data.sleep || []) + renderSleepList(data.sleep || []);
    bindSleepForm();
  } else {
    el.innerHTML = renderBodyForm() + renderBodyChart(data.body || []) + renderBodyList(data.body || []);
    bindBodyForm();

}

/* --- 睡眠 --- */
function renderSleepForm() {
  const today = formatDate(new Date());
  return `<div class="health-form">
    <h3 style="margin:0 0 12px;font-size:15px">添加睡眠记录</h3>
    <div class="row">
      <div class="field"><label style="font-size:12px;color:var(--ink-soft)">日期</label><input type="date" id="sleep-date" value="${today}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px" /></div>
      <div class="field"><label style="font-size:12px;color:var(--ink-soft)">入睡时间</label><input type="time" id="sleep-start" value="23:30" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px" /></div>
      <div class="field"><label style="font-size:12px;color:var(--ink-soft)">起床时间</label><input type="time" id="sleep-end" value="07:00" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px" /></div>
    </div>
    <div class="field" style="margin-top:10px">
      <label style="font-size:12px;color:var(--ink-soft)">睡眠评分</label>
      <div class="rating" id="sleep-rating">
        ${[1,2,3,4,5].map(n => `<button type="button" data-v="${n}">⭐</button>`).join('')}
      </div>
    </div>
    <button id="sleep-save" style="margin-top:12px;background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600">保存记录</button>
  </div>`;
}
function renderSleepChart(sleepData) {
  if (!sleepData.length) return '';
  const sorted = [...sleepData].sort((a,b) => a.date.localeCompare(b.date));
  const w = 320, h = 140, pad = 30;
  // Y 轴：评分 0-5
  const yMax = 5;
  const xStep = sleepData.length > 1 ? (w - pad*2) / (sleepData.length - 1) : 0;
  let points = '';
  let bars = '';
  sorted.forEach((d, i) => {
    const x = pad + i * xStep;
    const y = h - pad - (d.rating / yMax) * (h - pad*2);
    points += `${x},${y} `;
    bars += `<rect x="${x-12}" y="${h-pad - (d.rating/yMax)*(h-pad*2)}" width="24" height="${(d.rating/yMax)*(h-pad*2)}" fill="#4f6b3a" opacity="0.3" rx="3"/>`;
  });
  const polyline = `<polyline points="${points.trim()}" fill="none" stroke="#4f6b3a" stroke-width="2"/>`;
  const dots = sorted.map((d, i) => {
    const x = pad + i * xStep;
    const y = h - pad - (d.rating / yMax) * (h - pad*2);
    return `<circle cx="${x}" cy="${y}" r="3" fill="#4f6b3a"/><text x="${x}" y="${y-8}" font-size="9" text-anchor="middle" fill="#5a5d66">${d.rating}⭐</text>`;
  }).join('');
  // X 轴标签
  const xLabels = sorted.map((d, i) => {
    const x = pad + i * xStep;
    const label = d.date.slice(5);
    return `<text x="${x}" y="${h-pad+14}" font-size="8" text-anchor="middle" fill="#5a5d66">${label}</text>`;
  }).join('');
  return `<div class="chart-wrap"><h3>睡眠评分趋势</h3>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px">
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e7e5dc"/>
      <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#e7e5dc"/>
      ${bars}${polyline}${dots}${xLabels}
    </svg></div>`;
}
function renderSleepList(data) {
  if (!data.length) return '<div class="empty"><div class="big">😴</div>还没有记录，先添加一条吧</div>';
  const sorted = [...data].sort((a,b) => b.date.localeCompare(a.date));
  return '<div class="health-list">' + sorted.map(d => {
    const dur = calcSleepDur(d.start, d.end);
    return `<div class="health-row">
      <span class="date">${d.date.slice(5)}</span>
      <span class="vals">${d.start} → ${d.end}（${dur}h）· ${'⭐'.repeat(d.rating)}</span>
      <button class="del" data-id="${d.id}">删</button>
    </div>`;
  }).join('') + '</div>';
}
function calcSleepDur(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if (mins < 0) mins += 24*60; // 跨天
  return (mins / 60).toFixed(1);
}
let sleepRating = 3;
function bindSleepForm() {
  sleepRating = 3;
  const ratingEl = document.getElementById('sleep-rating');
  if (!ratingEl) return;
  updateRating(ratingEl, sleepRating);
  ratingEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    sleepRating = +b.dataset.v; updateRating(ratingEl, sleepRating);
  }));
  document.getElementById('sleep-save').addEventListener('click', () => {
    const date = document.getElementById('sleep-date').value;
    const start = document.getElementById('sleep-start').value;
    const end = document.getElementById('sleep-end').value;
    if (!date || !start || !end) { toast('请填写完整'); return; }
    const data = getHealthData();
    // 同一天覆盖
    data.sleep = (data.sleep || []).filter(s => s.date !== date);
    data.sleep.push({ id: genId(), date, start, end, rating: sleepRating });
    save(); renderAll();
    toast('睡眠记录已保存');
  });
  document.querySelectorAll('#health-content .health-row .del').forEach(b => b.addEventListener('click', () => {
    const data = getHealthData();
    data.sleep = data.sleep.filter(s => s.id !== b.dataset.id);
    save(); renderAll();
  }));
}
function updateRating(el, v) {
  el.querySelectorAll('button').forEach(b => b.classList.toggle('active', +b.dataset.v <= v));
}

/* --- 体重/腰围 --- */
function renderBodyForm() {
  const today = formatDate(new Date());
  return `<div class="health-form">
    <h3 style="margin:0 0 12px;font-size:15px">添加体重/腰围记录</h3>
    <div class="row">
      <div class="field"><label style="font-size:12px;color:var(--ink-soft)">日期</label><input type="date" id="body-date" value="${today}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px" /></div>
      <div class="field"><label style="font-size:12px;color:var(--ink-soft)">体重(kg)</label><input type="number" id="body-weight" step="0.1" placeholder="如 58.5" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px" /></div>
      <div class="field"><label style="font-size:12px;color:var(--ink-soft)">腰围(cm)</label><input type="number" id="body-waist" step="0.5" placeholder="如 72" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px" /></div>
    </div>
    <button id="body-save" style="margin-top:12px;background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600">保存记录</button>
  </div>`;
}
function renderBodyChart(bodyData) {
  if (!bodyData.length) return '';
  const sorted = [...bodyData].sort((a,b) => a.date.localeCompare(b.date));
  const w = 320, h = 140, pad = 35;
  const weights = sorted.map(d => d.weight).filter(v => v != null);
  const waists = sorted.map(d => d.waist).filter(v => v != null);
  const allVals = [...weights, ...waists];
  if (!allVals.length) return '';
  const yMin = Math.min(...allVals) - 2;
  const yMax = Math.max(...allVals) + 2;
  const xStep = sorted.length > 1 ? (w - pad*2) / (sorted.length - 1) : 0;
  function valY(v) { return h - pad - ((v - yMin) / (yMax - yMin)) * (h - pad*2); }
  // 体重折线
  let wPts = '', wDots = '';
  sorted.forEach((d, i) => {
    if (d.weight == null) return;
    const x = pad + i * xStep;
    const y = valY(d.weight);
    wPts += `${x},${y} `;
    wDots += `<circle cx="${x}" cy="${y}" r="3" fill="#4f6b3a"/>`;
  });
  // 腰围折线
  let sPts = '', sDots = '';
  sorted.forEach((d, i) => {
    if (d.waist == null) return;
    const x = pad + i * xStep;
    const y = valY(d.waist);
    sPts += `${x},${y} `;
    sDots += `<circle cx="${x}" cy="${y}" r="3" fill="#b14b3a"/>`;
  });
  const xLabels = sorted.map((d, i) => {
    const x = pad + i * xStep;
    return `<text x="${x}" y="${h-pad+14}" font-size="8" text-anchor="middle" fill="#5a5d66">${d.date.slice(5)}</text>`;
  }).join('');
  return `<div class="chart-wrap"><h3>体重/腰围趋势 <span style="color:#4f6b3a">●体重</span> <span style="color:#b14b3a">●腰围</span></h3>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px">
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e7e5dc"/>
      <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#e7e5dc"/>
      ${wPts ? `<polyline points="${wPts.trim()}" fill="none" stroke="#4f6b3a" stroke-width="2"/>` : ''}
      ${sPts ? `<polyline points="${sPts.trim()}" fill="none" stroke="#b14b3a" stroke-width="2" stroke-dasharray="4,2"/>` : ''}
      ${wDots}${sDots}${xLabels}
    </svg></div>`;
}
function renderBodyList(data) {
  if (!data.length) return '<div class="empty"><div class="big">⚖️</div>还没有记录，先添加一条吧</div>';
  const sorted = [...data].sort((a,b) => b.date.localeCompare(a.date));
  return '<div class="health-list">' + sorted.map(d => `<div class="health-row">
    <span class="date">${d.date.slice(5)}</span>
    <span class="vals">${d.weight ? d.weight+'kg' : ''} ${d.waist ? '· '+d.waist+'cm' : ''}</span>
    <button class="del" data-id="${d.id}">删</button>
  </div>`).join('') + '</div>';
}
function bindBodyForm() {
  document.getElementById('body-save').addEventListener('click', () => {
    const date = document.getElementById('body-date').value;
    const weight = parseFloat(document.getElementById('body-weight').value) || null;
    const waist = parseFloat(document.getElementById('body-waist').value) || null;
    if (!date || (!weight && !waist)) { toast('请至少填写体重或腰围'); return; }
    const data = getHealthData();
    data.body = (data.body || []).filter(b => b.date !== date);
    data.body.push({ id: genId(), date, weight, waist });
    save(); renderAll();
    toast('记录已保存');
  });
  document.querySelectorAll('#health-content .health-row .del').forEach(b => b.addEventListener('click', () => {
    const data = getHealthData();
    data.body = data.body.filter(s => s.id !== b.dataset.id);
    save(); renderAll();
  }));
}

/* ========== 资产管理视图 ========== */
// 数据结构：state.assets = { fields: ['支付宝','微信','银行卡'], records: [{date:'2026-08-01', values: {支付宝:1000, 微信:500}}] }
function getAssetData() {
  if (!state.assets) state.assets = { fields: ['支付宝', '微信'], records: [] };
  return state.assets;
}

function renderAssetView(cat, container) {
  const data = getAssetData();
  const today = formatDate(new Date());
  let total = 0;

  let html = '';

  // 1. 录入表单
  html += '<div class="health-form">';
  html += '<h3 style="margin:0 0 12px;font-size:15px">添加资产记录</h3>';
  html += '<div class="row">';
  html += `<div class="field"><label style="font-size:12px;color:var(--ink-soft)">日期</label><input type="date" id="asset-date" value="${today}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px" /></div>`;
  data.fields.forEach((f, i) => {
    html += `<div class="field"><label style="font-size:12px;color:var(--ink-soft)">${escapeHtml(f)} (元)</label><input type="number" id="asset-val-${i}" step="0.01" placeholder="0.00" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px" /></div>`;
  });
  html += '</div>';
  // 字段管理
  html += '<div style="display:flex;gap:6px;margin-top:10px;align-items:center">';
  html += '<input type="text" id="asset-new-field" placeholder="新字段名（如：银行卡）" style="flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px" />';
  html += '<button id="asset-add-field" style="background:var(--accent-soft);color:var(--accent);border:none;padding:6px 12px;border-radius:6px;font-size:13px">+ 字段</button>';
  html += '</div>';
  // 已有字段列表（可删）
  if (data.fields.length > 0) {
    html += '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">';
    data.fields.forEach((f, i) => {
      html += `<span style="background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;font-size:12px;display:flex;align-items:center;gap:4px">${escapeHtml(f)} <button data-del-field="${i}" style="border:none;background:none;color:var(--warn);font-size:14px;cursor:pointer;padding:0;line-height:1">×</button></span>`;
    });
    html += '</div>';
  }
  html += '<button id="asset-save" style="margin-top:12px;background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600">保存记录</button>';
  html += '</div>';

  // 2. 趋势图
  if (data.records.length > 0) {
    html += renderAssetChart(data);
    // 计算最新总资产
    const latest = [...data.records].sort((a,b) => b.date.localeCompare(a.date))[0];
    if (latest) {
      total = data.fields.reduce((s, f) => s + (latest.values[f] || 0), 0);
      html += `<div class="chart-wrap"><h3>最新总资产</h3><div style="font-size:28px;font-weight:700;color:var(--accent)">¥ ${total.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div><div style="font-size:12px;color:var(--ink-soft);margin-top:4px">截至 ${latest.date}</div></div>`;
    }
  } else {
    html += '<div class="empty"><div class="big">💰</div>还没有记录，先添加一条吧</div>';
  }

  // 3. 历史记录列表
  if (data.records.length > 0) {
    const sorted = [...data.records].sort((a,b) => b.date.localeCompare(a.date));
    html += '<div class="chart-wrap"><h3>历史记录</h3><div class="health-list">';
    sorted.forEach(r => {
      const sum = data.fields.reduce((s, f) => s + (r.values[f] || 0), 0);
      const vals = data.fields.map(f => r.values[f] ? `${escapeHtml(f)}: ¥${(+r.values[f]).toLocaleString('zh-CN')}` : '').filter(x => x).join(' · ');
      html += `<div class="health-row"><span class="date">${r.date.slice(5)}</span><span class="vals">${vals || '—'} <strong>合计 ¥${sum.toLocaleString('zh-CN')}</strong></span><button class="del" data-del-record="${r.id}">删</button></div>`;
    });
    html += '</div></div>';
  }

  container.innerHTML = html;

  // 绑定：添加字段
  const addFieldBtn = document.getElementById('asset-add-field');
  if (addFieldBtn) addFieldBtn.addEventListener('click', () => {
    const name = document.getElementById('asset-new-field').value.trim();
    if (!name) { toast('请输入字段名'); return; }
    if (data.fields.includes(name)) { toast('字段已存在'); return; }
    data.fields.push(name);
    save();
    renderAssetView(cat, container);
    toast('字段已添加');
  });
  // 删除字段
  container.querySelectorAll('[data-del-field]').forEach(b => b.addEventListener('click', () => {
    const idx = +b.dataset.delField;
    const fname = data.fields[idx];
    data.fields.splice(idx, 1);
    // 清理 records 里的该字段
    data.records.forEach(r => { delete r.values[fname]; });
    save();
    renderAssetView(cat, container);
    toast('字段已删除');
  }));
  // 保存记录
  const saveBtn = document.getElementById('asset-save');
  if (saveBtn) saveBtn.addEventListener('click', () => {
    const date = document.getElementById('asset-date').value;
    if (!date) { toast('请选择日期'); return; }
    const values = {};
    data.fields.forEach((f, i) => {
      const v = parseFloat(document.getElementById(`asset-val-${i}`).value);
      if (!isNaN(v)) values[f] = v;
    });
    // 同一天覆盖
    data.records = data.records.filter(r => r.date !== date);
    data.records.push({ id: genId(), date, values });
    save();
    renderAssetView(cat, container);
    toast('资产记录已保存');
  });
  // 删除记录
  container.querySelectorAll('[data-del-record]').forEach(b => b.addEventListener('click', () => {
    data.records = data.records.filter(r => r.id !== b.dataset.delRecord);
    save();
    renderAssetView(cat, container);
    toast('记录已删除');
  }));
}

function renderAssetChart(data) {
  const sorted = [...data.records].sort((a,b) => a.date.localeCompare(b.date));
  if (sorted.length < 1) return '';
  const w = 340, h = 200, pad = 46, padR = 16;
  // 计算每次记录的总资产
  const totals = sorted.map(r => ({
    date: r.date,
    total: data.fields.reduce((s, f) => s + (r.values[f] || 0), 0)
  }));
  const rawMax = Math.max(...totals.map(t => t.total));
  const maxV = rawMax > 0 ? rawMax * 1.15 : 100;
  const minV = 0;
  const xStep = totals.length > 1 ? (w - pad - padR) / (totals.length - 1) : 0;

  function valY(v) { return h - pad - ((v - minV) / (maxV - minV)) * (h - pad*2); }

  // Y 轴刻度（4 等分）
  let yGrid = '', yLabels = '';
  for (let gi = 0; gi <= 4; gi++) {
    const val = minV + (maxV - minV) * gi / 4;
    const y = valY(val);
    yGrid += `<line x1="${pad}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#efede5" stroke-width="1"/>`;
    yLabels += `<text x="${pad-6}" y="${y+3}" font-size="9" text-anchor="end" fill="#9a9da4">${val >= 1000 ? (val/1000).toFixed(1)+'k' : val.toFixed(0)}</text>`;
  }

  // 总资产折线
  let pts = '', dots = '', labels = '';
  totals.forEach((d, i) => {
    const x = totals.length > 1 ? pad + i * xStep : (pad + w - padR) / 2;
    const y = valY(d.total);
    pts += `${x},${y} `;
    const labelTxt = d.total >= 1000 ? (d.total/1000).toFixed(1)+'k' : d.total.toFixed(0);
    dots += `<circle cx="${x}" cy="${y}" r="3.5" fill="#4f6b3a"/>`;
    dots += `<text x="${x}" y="${y-9}" font-size="9" text-anchor="middle" fill="#4f6b3a" font-weight="bold">¥${labelTxt}</text>`;
    labels += `<text x="${x}" y="${h-pad+14}" font-size="8" text-anchor="middle" fill="#5a5d66">${d.date.slice(5)}</text>`;
  });
  // 各字段单独折线
  let fieldLines = '';
  const colors = ['#b14b3a', '#3a6b9b', '#9b6b3a', '#6b3a9b', '#3a9b6b', '#9b3a6b'];
  data.fields.forEach((f, fi) => {
    let fpts = '';
    let hasVal = false;
    sorted.forEach((r, i) => {
      const v = r.values[f];
      if (v == null) return;
      hasVal = true;
      const x = sorted.length > 1 ? pad + i * xStep : (pad + w - padR) / 2;
      const y = valY(v);
      fpts += `${x},${y} `;
    });
    if (fpts && hasVal) {
      fieldLines += `<polyline points="${fpts.trim()}" fill="none" stroke="${colors[fi % colors.length]}" stroke-width="1.5" opacity="0.55" stroke-dasharray="3,2"/>`;
    }
  });
  // 图例
  let legend = `<span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-size:11px"><span style="width:12px;height:3px;background:#4f6b3a;border-radius:2px"></span>总资产</span>`;
  data.fields.forEach((f, fi) => {
    legend += `<span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-size:11px"><span style="width:10px;height:3px;background:${colors[fi % colors.length]};border-radius:2px;opacity:.6"></span>${escapeHtml(f)}</span>`;
  });

  const polyline = pts ? `<polyline points="${pts.trim()}" fill="none" stroke="#4f6b3a" stroke-width="2.5"/>` : '';

  return `<div class="chart-wrap"><h3>📈 资产趋势</h3>
    <div style="margin-bottom:6px">${legend}</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px">
      ${yGrid}
      <line x1="${pad}" y1="${h-pad}" x2="${w-padR}" y2="${h-pad}" stroke="#c4c8be"/>
      <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#c4c8be"/>
      ${fieldLines}
      ${polyline}
      ${dots}${yLabels}${labels}
    </svg></div>`;
}

/* ========== 拖拽排序：条目 ========== */
let dragSrc = null;
function handleDragStart(e) {
  dragSrc = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', this.dataset.id);
}
function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  return false;
}
function handleDrop(e) {
  e.stopPropagation();
  if (dragSrc === this) return false;
  const fromId = dragSrc.dataset.id;
  const toId = this.dataset.id;
  const arr = activeItems().slice().sort((a,b) => Number(a.done) - Number(b.done) || (a.order||0) - (b.order||0) || b.created - a.created);
  const fromIdx = arr.findIndex(i => i.id === fromId);
  const toIdx = arr.findIndex(i => i.id === toId);
  if (fromIdx < 0 || toIdx < 0) return false;
  const [moved] = arr.splice(fromIdx, 1);
  arr.splice(toIdx, 0, moved);
  arr.forEach((it, i) => {
    const real = state.items[currentCatId].find(x => x.id === it.id);
    if (real) real.order = i;
  });
  save(); renderMain();
  return false;
}
function handleDragEnd() { this.classList.remove('dragging'); dragSrc = null; }

// 移动端长按排序：弹出排序弹窗
let longPressTimer = null;
function handleTouchStart(e) {
  e.preventDefault();
  longPressTimer = setTimeout(() => openItemSortModal(), 500);
}

/* ========== 条目排序弹窗 ========== */
const modalSort = document.getElementById('modal-sort');
let sortDragSrc = null;
function openItemSortModal() {
  const list = document.getElementById('sort-list');
  list.innerHTML = '';
  // 取当前分类+子分组的全部条目（不按 done 排序，保留原始 order）
  const arr = (state.items[currentCatId] || []).filter(i => {
    if (!currentSubId) return true;
    return i.subId === currentSubId;
  }).slice().sort((a,b) => (a.order||0) - (b.order||0) || b.created - a.created);
  arr.forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'manage-row';
    row.draggable = true;
    row.dataset.id = it.id;
    row.innerHTML = `
      <span class="emoji">${it.done ? '✅' : '⚪'}</span>
      <span class="name">${escapeHtml(it.text.slice(0, 40))}</span>
      <button data-act="up">↑</button>
      <button data-act="down">↓</button>
    `;
    row.querySelector('[data-act=up]').addEventListener('click', () => {
      if (idx === 0) return;
      const tmp = arr[idx]; arr[idx] = arr[idx-1]; arr[idx-1] = tmp;
      applySortOrder(arr);
    });
    row.querySelector('[data-act=down]').addEventListener('click', () => {
      if (idx === arr.length - 1) return;
      const tmp = arr[idx]; arr[idx] = arr[idx+1]; arr[idx+1] = tmp;
      applySortOrder(arr);
    });
    // 拖拽排序
    row.addEventListener('dragstart', e => { sortDragSrc = row; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', it.id); });
    row.addEventListener('dragover', e => { e.preventDefault(); return false; });
    row.addEventListener('drop', e => {
      e.stopPropagation();
      if (sortDragSrc === row) return false;
      const fromId = sortDragSrc.dataset.id;
      const toId = row.dataset.id;
      const fromIdx = arr.findIndex(x => x.id === fromId);
      const toIdx = arr.findIndex(x => x.id === toId);
      if (fromIdx < 0 || toIdx < 0) return false;
      const [moved] = arr.splice(fromIdx, 1);
      arr.splice(toIdx, 0, moved);
      applySortOrder(arr);
      return false;
    });
    row.addEventListener('dragend', () => { row.classList.remove('dragging'); sortDragSrc = null; });
    list.appendChild(row);
  });
  modalSort.classList.add('open');
}
function applySortOrder(arr) {
  // 把新顺序写回 state.items[currentCatId] 中对应条目的 order 字段
  arr.forEach((it, i) => {
    const real = state.items[currentCatId].find(x => x.id === it.id);
    if (real) real.order = i;
  });
  save();
  // 重新渲染排序弹窗和主区域
  openItemSortModal();
  renderMain();
}
function closeSort() { modalSort.classList.remove('open'); }

function openAddModal(catId, item) {
  const sel = document.getElementById('add-cat');
  sel.innerHTML = state.cats.map(c => `<option value="${c.id}">${escapeHtml(c.emoji + ' ' + c.name)}</option>`).join('');
  sel.value = catId || currentCatId;
  fillSubSelect(sel.value, item ? item.subId : '');
  document.getElementById('add-cat').addEventListener('change', () => fillSubSelect(document.getElementById('add-cat').value));
  document.getElementById('add-text').value = item ? item.text : '';
  document.getElementById('add-note').value = item ? (item.note || '') : '';
  modalAdd.dataset.itemId = item ? item.id : '';
  modalAdd.querySelector('h3').textContent = item ? '编辑内容' : '添加内容';
  modalAdd.classList.add('open');
  setTimeout(() => document.getElementById('add-text').focus(), 50);
}
function fillSubSelect(catId, selected) {
  const c = state.cats.find(x => x.id === catId);
  const subSel = document.getElementById('add-sub');
  let html = '<option value="">-- 不选 --</option>';
  (c && c.subs || []).forEach(s => html += `<option value="${s.id}">${escapeHtml(s.name)}</option>`);
  subSel.innerHTML = html;
  subSel.value = selected || '';
}
function closeAddModal() { modalAdd.classList.remove('open'); modalAdd.dataset.itemId = ''; }

document.getElementById('btn-add').addEventListener('click', () => openAddModal(currentCatId));
document.getElementById('add-save').addEventListener('click', () => {
  const text = document.getElementById('add-text').value.trim();
  const note = document.getElementById('add-note').value.trim();
  const catId = document.getElementById('add-cat').value;
  const subId = document.getElementById('add-sub').value;
  if (!text) { toast('请输入内容'); return; }
  if (!state.items[catId]) state.items[catId] = [];
  const editingId = modalAdd.dataset.itemId;
  if (editingId) {
    let found = false;
    for (const cid in state.items) {
      const idx = state.items[cid].findIndex(x => x.id === editingId);
      if (idx >= 0) {
        if (cid !== catId) {
          const [moved] = state.items[cid].splice(idx, 1);
          moved.text = text; moved.note = note; moved.subId = subId || undefined;
          if (!moved.date) moved.date = formatDate(new Date(moved.created || Date.now()));
          state.items[catId].unshift(moved);
        } else {
          state.items[cid][idx].text = text;
          state.items[cid][idx].note = note;
          state.items[cid][idx].subId = subId || undefined;
        }
        found = true;
        break;
      }
    }
    if (!found) return;
    toast('已更新');
  } else {
    state.items[catId].unshift({ id: genId(), text, note, subId: subId || undefined, done: false, created: Date.now(), date: formatDate(new Date()), order: 0 });
    toast('已添加');
  }
  save();
  currentCatId = catId;
  if (subId) currentSubId = subId;
  closeAddModal();
  renderAll();
});

/* ========== 弹窗：添加/编辑分类 ========== */
const modalCat = document.getElementById('modal-cat');
let chosenEmoji = '📌';
function renderEmojiRow() {
  const row = document.getElementById('emoji-row');
  row.innerHTML = '';
  EMOJI_OPTIONS.forEach(em => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = em;
    if (em === chosenEmoji) b.classList.add('active');
    b.addEventListener('click', () => {
      chosenEmoji = em;
      row.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
    row.appendChild(b);
  });
}
function openCatModal(catId) {
  editingCatId = catId || null;
  const cat = catId ? state.cats.find(c => c.id === catId) : null;
  document.getElementById('cat-title').textContent = cat ? '编辑分类' : '新建分类';
  document.getElementById('cat-name').value = cat ? cat.name : '';
  chosenEmoji = cat ? cat.emoji : '📌';
  renderEmojiRow();
  const delBtn = document.getElementById('cat-delete');
  delBtn.style.display = (cat && !cat.builtin) ? '' : 'none';
  modalCat.classList.add('open');
  setTimeout(() => document.getElementById('cat-name').focus(), 50);
}
function closeCatModal() { modalCat.classList.remove('open'); editingCatId = null; }

document.getElementById('cat-save').addEventListener('click', () => {
  const name = document.getElementById('cat-name').value.trim();
  if (!name) { toast('请输入分类名'); return; }
  if (editingCatId) {
    const cat = state.cats.find(c => c.id === editingCatId);
    cat.name = name; cat.emoji = chosenEmoji;
    toast('已保存');
  } else {
    const id = 'cat_' + Date.now().toString(36);
    state.cats.push({ id, name, emoji: chosenEmoji, builtin: false, subs: [] });
    if (!state.items[id]) state.items[id] = [];
    currentCatId = id;
    toast('已创建');
  }
  save(); closeCatModal(); renderAll();
});
document.getElementById('cat-delete').addEventListener('click', () => {
  if (!editingCatId) return;
  const cat = state.cats.find(c => c.id === editingCatId);
  if (!cat || cat.builtin) return;
  if (!confirm(`确定删除"${cat.name}"及其全部内容吗？`)) return;
  state.cats = state.cats.filter(c => c.id !== editingCatId);
  delete state.items[editingCatId];
  if (currentCatId === editingCatId) currentCatId = state.cats[0].id;
  save(); closeCatModal(); renderAll();
  toast('已删除');
});

/* ========== 弹窗：管理分类（拖拽排序） ========== */
const modalManage = document.getElementById('modal-manage');
let manageDragSrc = null;
function openManage() {
  const list = document.getElementById('manage-list');
  list.innerHTML = '';
  state.cats.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'manage-row';
    row.draggable = true;
    row.dataset.index = i;
    row.innerHTML = `
      <span class="emoji">${c.emoji}</span>
      <span class="name">${escapeHtml(c.name)}${c.builtin ? ' <span style="color:var(--ink-soft);font-size:11px">（默认）</span>' : ''}</span>
      <button data-act="edit">编辑</button>
      <button class="del" data-act="del">删除</button>
    `;
    row.querySelector('[data-act=edit]').addEventListener('click', () => { closeManage(); openCatModal(c.id); });
    row.querySelector('[data-act=del]').addEventListener('click', () => {
      if (c.builtin) { toast('默认分类不能删除'); return; }
      if (!confirm(`确定删除"${c.name}"及其全部内容吗？`)) return;
      state.cats = state.cats.filter(x => x.id !== c.id);
      delete state.items[c.id];
      if (currentCatId === c.id) currentCatId = state.cats[0].id;
      save(); openManage(); renderAll();
    });
    row.addEventListener('dragstart', e => { manageDragSrc = row; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', i); });
    row.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; });
    row.addEventListener('drop', e => {
      e.stopPropagation();
      if (manageDragSrc === row) return false;
      const from = +manageDragSrc.dataset.index;
      const to = +row.dataset.index;
      const [moved] = state.cats.splice(from, 1);
      state.cats.splice(to, 0, moved);
      save(); openManage(); renderAll();
      return false;
    });
    row.addEventListener('dragend', () => { row.classList.remove('dragging'); manageDragSrc = null; });
    list.appendChild(row);
  });
  modalManage.classList.add('open');
}
function closeManage() { modalManage.classList.remove('open'); }

document.getElementById('btn-manage').addEventListener('click', openManage);
document.getElementById('btn-add-cat').addEventListener('click', () => openCatModal(null));

/* ========== 导出 / 导入数据 ========== */
// 导出：把当前 state 打包成 JSON 文件下载（格式与 data.json 一致，方便上传 GitHub）
document.getElementById('btn-export').addEventListener('click', () => {
  const data = {
    cats: state.cats,
    items: state.items,
    health: state.health,
    assets: state.assets,
    currentCatId,
    currentSubId,
    userName: state.userName,
    userSub: state.userSub,
    heroSubs: state.heroSubs,
    updatedAt: Date.now()
  };
  const json = JSON.stringify(data, null, 2);
  // 生成下载
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出 data.json 备份');
  // 同时复制到剪贴板兜底
  if (navigator.clipboard) {
    navigator.clipboard.writeText(json).then(() => {
      setTimeout(() => toast('数据已复制到剪贴板'), 1800);
    }).catch(() => {});
  }
});

// 导入：点击触发文件选择
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('import-file').click();
});

// 也支持粘贴 JSON 文本导入
let importMode = false;
document.getElementById('btn-import').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const text = prompt('粘贴之前导出的 JSON 文本（整段）：', '');
  if (text && text.trim()) importFromText(text.trim());
});

// 从云端（jsDelivr CDN）拉取数据
document.getElementById('btn-cloud-restore').addEventListener('click', async () => {
  const btn = document.getElementById('btn-cloud-restore');
  if (!getSyncToken()) {
    if (!ensureSyncToken()) { toast('请先设置同步令牌'); return; }
  }
  if (!confirm('将从云端拉取最新数据并覆盖当前本地数据，是否继续？')) return;
  btn.textContent = '☁ 拉取中...'; btn.disabled = true;
  const ok = await cloudPull(true);
  btn.textContent = '☁ 从云端拉取数据'; btn.disabled = false;
  if (ok) {
    closeDrawer();
    renderDate();
    renderAll();
    toast('已从云端拉取数据 ✓');
  } else {
    toast('拉取失败：请检查网络或令牌');
  }
});

// 设置同步令牌
document.getElementById('btn-set-token').addEventListener('click', () => {
  const current = getSyncToken();
  const hint = current ? '（已设置，重新输入可替换）' : '';
  const t = prompt('请输入 Gitee 私人令牌' + hint + '：\n\n在 Gitee → 设置 → 私人令牌 生成，权限勾选 projects。仅保存在本地浏览器。', current);
  if (t !== null && t.trim()) {
    setSyncToken(t.trim());
    const btn = document.getElementById('btn-set-token');
    btn.textContent = '🔑 令牌已设置 ✓';
    btn.style.color = 'var(--accent)';
    toast('令牌已保存，自动同步已启用');
    setTimeout(() => { btn.textContent = '🔑 设置同步令牌'; btn.style.color = 'var(--ink-soft)'; }, 2000);
  }
});

// 导出页面源码（方便上传到 GitHub Pages）
document.getElementById('btn-export-source').addEventListener('click', async () => {
  const modal = document.getElementById('modal-source');
  const out = document.getElementById('source-output');
  try {
    const r = await fetch(location.href);
    const html = await r.text();
    out.value = html;
    modal.classList.add('open');
    setTimeout(() => out.select(), 100);
  } catch (e) {
    toast('获取源码失败');
  }
});
document.getElementById('source-copy').addEventListener('click', () => {
  const out = document.getElementById('source-output');
  out.select();
  try {
    document.execCommand('copy');
    toast('源码已复制，去 GitHub 粘贴吧');
  } catch (e) {
    toast('复制失败，请长按文本框手动复制');
  }
});

document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const text = ev.target.result;
    importFromText(text);
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = ''; // 允许重复选同一文件
});

function importFromText(text) {
  try {
    const data = JSON.parse(text);
    if (!data.cats && !data.items) { toast('格式不对：缺少 cats/items'); return; }
    // 合并导入：默认分类保留，自定义分类追加；条目按分类合并
    const importCats = data.cats || [];
    const importItems = data.items || {};
    // 合并 cats
    const mergedCats = [...state.cats];
    importCats.forEach(c => {
      if (!mergedCats.find(x => x.id === c.id)) {
        mergedCats.push({ ...c, subs: c.subs || [] });
      } else {
        // 已存在：更新名称和 emoji，subs 合并
        const ex = mergedCats.find(x => x.id === c.id);
        ex.name = c.name || ex.name;
        ex.emoji = c.emoji || ex.emoji;
        if (c.subs) {
          ex.subs = ex.subs || [];
          c.subs.forEach(s => { if (!ex.subs.find(x => x.id === s.id)) ex.subs.push(s); });
        }
      }
    });
    // 合并 items：同 id 的条目以导入为准（覆盖）
    const mergedItems = { ...state.items };
    for (const catId in importItems) {
      if (!mergedItems[catId]) mergedItems[catId] = [];
      const existing = mergedItems[catId];
      const incoming = importItems[catId] || [];
      incoming.forEach(it => {
        const idx = existing.findIndex(x => x.id === it.id);
        if (idx >= 0) existing[idx] = it;
        else existing.push(it);
      });
    }
    state.cats = mergedCats;
    state.items = mergedItems;
    if (data.userName) state.userName = data.userName;
    if (data.userSub) state.userSub = data.userSub;
    if (data.heroSubs) state.heroSubs = { ...state.heroSubs, ...data.heroSubs };
    save();
    closeDrawer();
    renderAll();
    toast('导入成功 ✓');
  } catch (e) {
    toast('导入失败：' + (e.message || 'JSON 格式错误'));
  }
}

/* ========== 抽屉 ========== */
const drawer = document.getElementById('drawer');
const scrim = document.getElementById('scrim');
function openDrawer() { drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false'); }
function closeDrawer() { drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
document.getElementById('btn-menu').addEventListener('click', openDrawer);
scrim.addEventListener('click', closeDrawer);
let touchStartX = 0, touchDX = 0, touching = false;
drawer.addEventListener('touchstart', e => { touching = true; touchStartX = e.touches[0].clientX; touchDX = 0; }, {passive:true});
drawer.addEventListener('touchmove', e => { if (!touching) return; touchDX = e.touches[0].clientX - touchStartX; if (touchDX < 0) drawer.style.transform = `translateX(${Math.max(touchDX, -80)}px)`; }, {passive:true});
drawer.addEventListener('touchend', () => { touching = false; if (touchDX < -60) closeDrawer(); drawer.style.transform = ''; touchDX = 0; });

/* ========== 模态框通用关闭 ========== */
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => {
  modalAdd.classList.remove('open');
  modalCat.classList.remove('open');
  modalManage.classList.remove('open');
  modalSort.classList.remove('open');
}));
[modalAdd, modalCat, modalManage, modalSort].forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

/* ========== 工具 ========== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

// 键盘
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openDrawer(); }
  if (e.key === 'Escape') {
    modalAdd.classList.remove('open');
    modalCat.classList.remove('open');
    modalManage.classList.remove('open');
    modalSort.classList.remove('open');
    if (drawer.classList.contains('open')) closeDrawer();
  }
});

// contenteditable 回车防换行，改为失焦
function preventEnter(id) {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
}
preventEnter('user-name'); preventEnter('user-sub'); preventEnter('hero-sub');

/* ========== 启动 ========== */
renderDate();
renderAll();
// 启动时从云端拉取最新数据
cloudPull().then((updated) => {
  if (updated) {
    renderDate();
    renderAll();
  }
});
</script>
